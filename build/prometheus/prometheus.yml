global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "dddance-backend"
    static_configs:
      - targets: ["main:9091"]
    metrics_path: /metrics

  - job_name: "dddance-ml"
    static_configs:
      - targets: ["ml-service:8000"]
    metrics_path: /metrics

  - job_name: "kafka-exporter"
    static_configs:
      - targets: ["kafka-exporter:9308"]
