apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: dddance-dev
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: backend
          image: dddance-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5458
            - containerPort: 9091
              name: metrics
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: jwt-secret
            - name: ML_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: ml-internal-token
          livenessProbe:
            httpGet:
              path: /health
              port: 5458
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5458
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
