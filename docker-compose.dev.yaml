services:
  postgres:
    build:
      context: .
      dockerfile: ./build/pg.Dockerfile
    container_name: postgres
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      POSTGRES_DB: DDDance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - ./build/sql/:/docker-entrypoint-initdb.d/
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d DDDance"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ddd-network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ddd-network

  achievements-worker:
    build:
      context: .
      dockerfile: ./build/achievements-worker.Dockerfile
    container_name: achievements-worker
    restart: unless-stopped
    env_file:
      - .env.dev
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - ddd-network

  notifications:
    build:
      context: .
      dockerfile: ./build/notifications.Dockerfile
    container_name: notifications
    restart: unless-stopped
    env_file:
      - .env.dev
    ports:
      - "5460:5460"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - ddd-network

  main:
    build:
      context: .
      dockerfile: ./build/main.Dockerfile

    ports:
      - "5458:5458"
    container_name: main
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      AUTH_SERVICE_HOST: auth
      AUTH_SERVICE_PORT: 5459
      GRPC_TLS_CA: /certs/ca.crt
    volumes:
      - ./build/certs:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      notifications:
        condition: service_started
    networks:
      - ddd-network
      - ml-internal

  auth:
    build:
      context: .
      dockerfile: ./build/auth.Dockerfile
    container_name: auth
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      GRPC_TLS_CERT: /certs/auth-server.crt
      GRPC_TLS_KEY: /certs/auth-server.key
    volumes:
      - ./build/certs:/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ddd-network

  # The user Telegram bot was extracted into a standalone unit at the repo root:
  # ../TelegramBot (own Dockerfile + docker-compose.yaml). It joins this stack's
  # external `ddd-network` to reach `redis` and `main`. Start it with:
  #   cd ../TelegramBot && docker compose up -d --build
  streak-worker:
    build:
      context: .
      dockerfile: ./build/streak-worker.Dockerfile
    container_name: streak-worker
    restart: unless-stopped
    env_file:
      - .env.dev
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - ddd-network

  analytics-worker:
    build:
      context: .
      dockerfile: ./build/analytics-worker.Dockerfile
    container_name: analytics-worker
    restart: unless-stopped
    env_file:
      - .env.dev
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - ddd-network

  recommendation-worker:
    build:
      context: .
      dockerfile: ./build/recommendation-worker.Dockerfile
    container_name: recommendation-worker
    restart: unless-stopped
    env_file:
      - .env.dev
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - ddd-network
      - ml-internal

  activity-feed-worker:
    build:
      context: .
      dockerfile: ./build/activity-feed-worker.Dockerfile
    container_name: activity-feed-worker
    restart: unless-stopped
    env_file:
      - .env.dev
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - ddd-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ddd-network

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:29092 --list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - ddd-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - ddd-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./build/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"
    networks:
      - ddd-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./build/grafana/dashboards:/var/lib/grafana/dashboards
      - ./build/grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - ddd-network

volumes:
  postgres_data:
  grafana_data:

networks:
  ddd-network:
    name: ddd-network
  ml-internal:
    name: ml-internal